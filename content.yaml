# ------ Fallback Course Detail (when Firestore is empty) ------
fallbackCourse:
  title: "Ops to Business Analyst - Financial Markets Career Transformation"
  slug: "ops-to-business-analyst"
  description: "Transform your operations career into a high-demand BA role in Capital Markets."
  category: "Financial Markets"
  language: "English + Hindi"
  tooling: "Live Trading System, OMS, Position Keeping Tools"
  timeRequirement: "6-8 hrs/week"
  duration: "8 Weeks"
  liveSessions: "Weekend Live Sessions"
  certificate: "Career Transformation Certificate"
  enrolledCount: 50
  bonuses:
    - "1-on-1 CV review & BA profile positioning"
    - "Mock interview sessions with industry scenarios"
    - "Access to exclusive BA job referral network"
  instructor:
    name: "Your Trainer"
    title: "Senior Business Analyst - Financial Markets Specialist"
    bio: "Senior Business Analyst with 20+ years of experience across global investment banks and tier-1 financial institutions. Expert in Trade Lifecycle, Financial Products & Capital Markets BA delivery. Has trained professionals who are now working as BAs at top investment banks worldwide."
  faqs:
    - question: "Who is this programme for?"
      answer: "This programme is designed for operations professionals with 3-8 years of experience in trade & settlement ops, financial products, banking & capital markets. If you understand the business from an ops perspective and want to transition to a strategic BA role, this is for you."
    - question: "Do I need prior BA experience?"
      answer: "No. The programme covers BA skills from the ground up. Your operations experience is actually your biggest asset - we help you reframe it as domain expertise that hiring managers value highly."
    - question: "What makes this different from other BA courses?"
      answer: "Three things: (1) You get hands-on access to a live trading system - not just theory, (2) The trainer has 20+ years of actual capital markets BA experience, and (3) The AI module gives you future-ready skills that most BAs don't have yet."
    - question: "Are the sessions live or recorded?"
      answer: "All sessions are conducted live with recordings made available within 24 hours. You can watch the recordings at your convenience if you miss a live session."
    - question: "What is your refund policy?"
      answer: "No refund is offered, it is at less than the cost of your one meal!"
    - question: "What is your refund policy?"
      answer: "No refund is offered..."
  weeks:
    - title: "Pillar A: BA Core Skills"
      lessons:
        - "Requirement Gathering & Analysis"
        - "Process Mapping & Gap Analysis"
        - "BRD, FRD & User Stories"
        - "Agile / Scrum Methodology"
        - "UAT Planning & Execution"
        - "Stakeholder Communication & Workshops"
    - title: "Pillar B: Trade Lifecycle & Financial Products"
      lessons:
        - "Trade Lifecycle (Order to Settlement)"
        - "Derivatives & FX Products"
        - "Confirmations & Reconciliation"
        - "Regulatory Reporting Fundamentals"
        - "Pricing Fundamentals"
    - title: "Pillar C: AI + Future Skills"
      lessons:
        - "Generative AI Fundamentals"
        - "AI in BA Workflows & Delivery"
        - "Prompt Engineering for Analysts"
        - "Automation Mindset & Tooling"
        - "Smart Documentation Using AI"
  glanceItems:
    - label: "Language"
      value: "English"
    - label: "Tooling"
      value: "Live Trading System, OMS, Position Keeping Tools"
    - label: "Time Requirement"
      value: "2 hours each on a Saturday, Sunday over a weekend"
    - label: "Commitment"
      value: "1 Weekend"
    - label: "Live Sessions"
      value: "Weekend Live Sessions"
    - label: "Certificate Type"
      value: "Career Transformation Certificate"

# ------ Legal pages ------
legal:
  lastUpdated: "Last updated: April 2026"
  contactEmail: "ops2batransition@gmail.com"

  terms:
    title: "Terms & Conditions"
    sections:
      - heading: "1. Acceptance of Terms"
        body: "By accessing and using the BA Courses platform (\"Service\"), you agree to be bound by these Terms and Conditions. If you do not agree with any part of these terms, you may not access the Service. These terms apply to all visitors, users, and others who access or use the Service."
      - heading: "2. User Accounts"
        body: "When you create an account with us, you must provide accurate, complete, and up-to-date information. Failure to do so constitutes a breach of the Terms, which may result in immediate termination of your account. You are responsible for safeguarding the password that you use to access the Service and for any activities or actions under your password."
      - heading: "3. Course Access and License"
        body: "Upon purchasing a course, you are granted a limited, non-exclusive, non-transferable license to access and view the course content for personal, non-commercial educational purposes. You may not reproduce, distribute, modify, create derivative works of, publicly display, or otherwise exploit any course content without prior written permission."
      - heading: "4. Payment Terms"
        body: "All course fees are listed in Indian Rupees (INR) unless otherwise specified. Prices are subject to change without notice. Payment is processed securely through our payment partners. You agree to provide current, complete, and accurate purchase and account information for all purchases made on the platform."
      - heading: "5. Intellectual Property"
        body: "The Service and its original content, features, and functionality are and will remain the exclusive property of BA Courses and its licensors. The Service is protected by copyright, trademark, and other laws. Our trademarks and trade dress may not be used in connection with any product or service without prior written consent."
      - heading: "6. Limitation of Liability"
        body: "In no event shall BA Courses, its directors, employees, partners, agents, suppliers, or affiliates be liable for any indirect, incidental, special, consequential, or punitive damages, including loss of profits, data, use, goodwill, or other intangible losses resulting from your access to or use of (or inability to access or use) the Service."
      - heading: "7. Changes to Terms"
        body: "We reserve the right, at our sole discretion, to modify or replace these Terms at any time. If a revision is material, we will try to provide at least 30 days' notice prior to any new terms taking effect. What constitutes a material change will be determined at our sole discretion. By continuing to access or use our Service after those revisions become effective, you agree to be bound by the revised terms."
      - heading: "8. Contact Us"
        body: "If you have any questions about these Terms, please contact us at ops2batransition@gmail.com"

  privacy:
    title: "Privacy Policy"
    sections:
      - heading: "1. Information We Collect"
        body: "We collect information you provide directly to us, including your name, email address, phone number, and payment information when you create an account, purchase a course, or contact us. We also collect information automatically when you use our platform, such as your IP address, browser type, and usage data."
      - heading: "2. How We Use Your Information"
        body: "We use the information we collect to provide, maintain, and improve our services; process transactions and send related information; send you technical notices, updates, security alerts, and support messages; respond to your comments, questions, and requests; and communicate with you about products, services, offers, and events."
      - heading: "3. Information Sharing"
        body: "We do not sell, trade, or otherwise transfer your personal information to outside parties. This does not include trusted third parties who assist us in operating our website, conducting our business, or serving our users, so long as those parties agree to keep this information confidential. We may also release information when release is appropriate to comply with the law."
      - heading: "4. Data Security"
        body: "We implement a variety of security measures to maintain the safety of your personal information. Your personal information is contained behind secured networks and is only accessible by a limited number of persons who have special access rights to such systems and are required to keep the information confidential."
      - heading: "5. Cookies and Tracking"
        body: "We use cookies and similar tracking technologies to track activity on our platform and hold certain information. Cookies are files with a small amount of data which may include an anonymous unique identifier. You can instruct your browser to refuse all cookies or to indicate when a cookie is being sent."
      - heading: "6. Third-Party Services"
        body: "Our platform may contain links to third-party websites or services that are not operated by us. We have no control over and assume no responsibility for the content, privacy policies, or practices of any third-party websites or services. We strongly advise you to review the privacy policy of every site you visit."
      - heading: "7. Your Rights"
        body: "You have the right to access, update, or delete your personal information at any time. You can do this through your account settings or by contacting us directly. You also have the right to opt out of marketing communications by following the unsubscribe link in our emails."
      - heading: "8. Contact Us"
        body: "If you have any questions about this Privacy Policy, please contact us at ops2batransition@gmail.com."

  shipping:
    title: "Shipping & Delivery Policy"
    sections:
      - heading: "1. Digital Product Delivery"
        body: "BA Courses is a digital learning platform. All courses and learning materials are delivered electronically through our website. There are no physical products that require shipping. Upon successful payment, you will receive instant access to your purchased course through your account dashboard."
      - heading: "2. Access Timeline"
        body: "Course access is typically granted immediately after successful payment processing. In rare cases, there may be a delay of up to 30 minutes due to payment verification. If you do not receive access within 1 hour of payment, please contact our support team."
      - heading: "3. Course Content Availability"
        body: "Live courses are delivered on a scheduled basis as per the course timeline. Pre-recorded content is available on-demand once you have access. Live sessions are recorded and made available within 24 hours of the session. Course materials, assignments, and resources are accessible throughout your enrollment period."
      - heading: "4. Certificates"
        body: "Digital certificates are generated automatically upon course completion and are available for download from your account dashboard. If you require a physical copy of your certificate, please contact us and we will arrange delivery at an additional cost, subject to your location."
      - heading: "5. Technical Requirements"
        body: "To access our courses, you need a stable internet connection and a modern web browser (Chrome, Firefox, Safari, or Edge). Some courses may have additional software requirements which will be listed on the course page. We recommend a minimum internet speed of 5 Mbps for streaming video content."
      - heading: "6. Contact Us"
        body: "If you experience any issues accessing your purchased courses, please contact us at ops2batransition@gmail.com or call us at +91 9381379483."

