# ------ Testimonials section ------
testimonials:
  heading: "Success Stories"
  subheading: "From operations professionals to Business Analysts in Financial Markets"
  items:
    - name: "Ankit M."
      role: "Ex-Trade Settlement Ops, Now BA at Global Investment Bank"
      quote: "After 5 years in trade settlement, I felt stuck. This programme gave me the exact framework to position my ops experience as a strength. Within 3 months of completing the course, I landed a BA role at a top-tier investment bank. The live trading system access was a game-changer in interviews."
    - name: "Priya S."
      role: "Former Middle Office Ops, Now Senior BA - Capital Markets"
      quote: "The curriculum is incredibly practical. Learning BRD/FRD writing alongside actual trade lifecycle scenarios made everything click. The AI module helped me stand out - I was the only candidate who could demonstrate AI-assisted documentation skills. Highly recommend for anyone in ops wanting to make the switch."
    - name: "Rahul K."
      role: "Ex-Reconciliation Analyst, Now Business Analyst - Fixed Income"
      quote: "I was skeptical about online programmes, but the hands-on approach here is unlike anything else. Working with a real trading platform, understanding OMS and position keeping from a BA perspective - this is exactly what the interviews test you on. Worth every rupee."
    - name: "Sneha D."
      role: "Former Corporate Actions Ops, Now BA at Fintech"
      quote: "The trainer's 20+ years of experience really shows. Every concept was explained with real-world examples from actual investment bank projects. The stakeholder management and requirement gathering techniques I learned here are things I use daily in my new BA role."
    - name: "Vikram T."
      role: "Ex-Trade Support, Now Business Analyst - Derivatives"
      quote: "What sets this programme apart is the live trading system access. Being able to navigate order management, settlement workflows, and position keeping hands-on gave me confidence that no textbook could. The AI skills module was the cherry on top - my hiring manager specifically mentioned it as a differentiator."

